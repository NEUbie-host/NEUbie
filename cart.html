<div id="checkout-modal" class="modal" style="display:none;">
	<div class="modal-content">
		<span class="close-btn">&times;</span>
		<h4>Checkout Information</h4>
		<form id="checkout-form">
			<div class="form-group">
				<label>Full Name</label>
				<input type="text" class="form-control" required />
			</div>
			<div class="form-group">
				<label>Email</label>
				<input type="email" class="form-control" required />
			</div>
			<div class="form-group">
				<label>Address</label>
				<input type="text" class="form-control" required />
			</div>
			<div class="form-group">
				<label>Payment Method</label>
				<select id="payment-method" class="form-control" required>
					<option value="">-- Select --</option>
					<option value="visa">Visa / MasterCard</option>
					<option value="momo">Momo</option>
					<option value="zalopay">ZaloPay</option>
					<option value="cod">Cash on Delivery</option>
				</select>
			</div>
			<div class="form-group" id="card-info">
				<label>Card Number</label>
				<input type="text" class="form-control" maxlength="16" pattern="\d{16}" placeholder="1234 5678 9012 3456" />
			</div>
			<button type="submit" class="btn btn-primary btn-block">Confirm Payment</button>
		</form>
	</div>
</div>
<script>
document.getElementById("checkout-btn").addEventListener("click", function () {
	document.getElementById("checkout-modal").style.display = "flex";
});

// Đóng modal khi bấm dấu X
document.querySelector(".close-btn").addEventListener("click", function () {
	document.getElementById("checkout-modal").style.display = "none";
});

// Ẩn hiện trường nhập thẻ tùy vào phương thức thanh toán
document.getElementById("payment-method").addEventListener("change", function () {
	const method = this.value;
	const cardInfo = document.getElementById("card-info");
	if (method === "visa") {
		cardInfo.style.display = "block";
	} else {
		cardInfo.style.display = "none";
	}
});

// Xử lý form
document.getElementById("checkout-form").addEventListener("submit", function (e) {
	e.preventDefault();
	alert("Payment successful! Thank you for your order.");
	document.querySelector(".col.cart").style.display = "none";
	document.querySelector(".col.thanks").style.display = "block";
	document.getElementById("checkout-modal").style.display = "none";
	localStorage.removeItem("cart");
});
</script>
<script>
	$(document).ready(function () {
		$('#confirm-payment-btn').click(function () {
			// Giả lập xác nhận thanh toán
			$('.cart').fadeOut(300, function () {
				$('.thanks').fadeIn(600);
			});
		});
	});
</script>
